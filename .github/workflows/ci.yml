name: CommerceQA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run API tests
        run: |
          pytest tests/api -v